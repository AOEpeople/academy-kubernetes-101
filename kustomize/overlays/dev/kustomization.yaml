apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: lab-kustomize-dev

configMapGenerator:
  - literals:
      - msg=Hello world!
      - env=dev
    name: my-config

patches:
  - path: replicas.yaml

labels:
  - includeSelectors: true
    pairs:
      env: dev
