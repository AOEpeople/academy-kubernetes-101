apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-strategies-canary-blue
  namespace: deployment-strategies
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployment-strategies-canary
      version: blue
  template:
    metadata:
      labels:
        app: deployment-strategies-canary
        version: blue
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:latest
          args:
            - "-text=version: blue"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-strategies-canary-green
  namespace: deployment-strategies
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployment-strategies-canary
      version: green
  template:
    metadata:
      labels:
        app: deployment-strategies-canary
        version: green
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:latest
          args:
            - "-text=version: green"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: deployment-strategies-canary-blue
  namespace: deployment-strategies
spec:
  selector:
    app: deployment-strategies-canary
    version: blue
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: deployment-strategies-canary-green
  namespace: deployment-strategies
spec:
  selector:
    app: deployment-strategies-canary
    version: green
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deployment-strategies-canary
  namespace: deployment-strategies
spec:
  ingressClassName: nginx
  rules:
    - host: deployment-strategies-canary.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deployment-strategies-canary-blue
                port:
                  number: 80
