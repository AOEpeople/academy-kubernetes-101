apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-strategies-rolling
  namespace: deployment-strategies
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: deployment-strategies-rolling
  template:
    metadata:
      labels:
        app: deployment-strategies-rolling
    spec:
      containers:
        - name: deployment-strategies-rolling
          image: hashicorp/http-echo:latest
          args:
            - "-text=version: blue"
            - "-listen=:8080"
          ports:
            - containerPort: 8080