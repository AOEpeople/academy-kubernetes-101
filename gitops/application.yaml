apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-chart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/AOEpeople/academy-kubernetes-101.git"
    targetRevision: main
    path: helm/simple-chart
    helm:
      releaseName: simple-chart
  destination:
    server: "https://kubernetes.default.svc"
    namespace: lab-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
